name: deploy-pages

on:
  push:
    branches: [arena/01a0dfab-powr, main]
    paths:
      - 'presentation/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Pages site exists (create if missing)
        run: |
          code=$(curl -s -o /tmp/pages.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"build_type":"workflow"}')
          echo "POST /pages -> $code"; cat /tmp/pages.json || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (presentation/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: presentation

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
